name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # Self-hosted runner: never run code from forks on it
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ec2-deploy]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ec2-deploy]
    defaults:
      run:
        working-directory: webs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker-build:
    # Proves both images build; nothing is pushed on PRs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ec2-deploy]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chatbot-backend:pr-${{ github.run_id }} backend
      - run: docker build -t chatbot-frontend:pr-${{ github.run_id }} webs
      - if: always()
        run: docker rmi -f chatbot-backend:pr-${{ github.run_id }} chatbot-frontend:pr-${{ github.run_id }} || true

  # Single stable name to require in branch protection
  pr-checks:
    if: always()
    needs: [backend, frontend, docker-build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.backend.result }}" = success ] && \
          [ "${{ needs.frontend.result }}" = success ] && \
          [ "${{ needs.docker-build.result }}" = success ]
